name: Deploy IsekaiBoxer Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble web package
        run: |
          cat IsekaiBoxer-Web-latest.zip.part00 \
              IsekaiBoxer-Web-latest.zip.part01 \
              IsekaiBoxer-Web-latest.zip.part02 > /tmp/web.zip

      - name: Extract site
        run: |
          rm -rf _site
          mkdir _site
          unzip -q /tmp/web.zip -d _site
          touch _site/.nojekyll
          test -f _site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
